[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handwritten-digits-cnn"
version = "0.1.0"
description = "Controlled CNN studies on a 10,000-digit stylus dataset: writer diversity, the MNIST <-> stylus domain gap, and morphological dilation (NumPy + PyTorch)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "matplotlib>=3.7", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["digitstudy*", "myAPI*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
