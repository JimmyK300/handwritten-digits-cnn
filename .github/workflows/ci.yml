name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy matplotlib scipy pytest
      - name: Unit tests (incl. NumPy CNN gradient checks)
        run: pytest -q
      - name: Training smoke test (dilation study + regimes, 1 seed, 1 epoch)
        run: python -m digitstudy smoke
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results_smoke/
